name: Deploy to AWS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      # 1. Checkout code
      - name: Checkout
        uses: actions/checkout@v3

      # 2. Configure AWS (OIDC Role)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::892386869854:role/GRANO-PROPERTIES
          aws-region: us-east-1

      # 3. Install dependencies
      - name: Install dependencies
        run: npm install

      # 4. Build project (Vite)
      - name: Build project
        run: npm run build

      # 5. Deploy ONLY build files to S3
      - name: Deploy to S3
        run: |
          aws s3 sync ./dist s3://granoproperties.com --delete

      # 6. Invalidate CloudFront cache
      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation --distribution-id EPS8DMVSGPO8C --paths "/*"
